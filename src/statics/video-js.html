<!--suppress JSUnresolvedLibraryURL, CssUnusedSymbol -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://vjs.fusioncdn.com/7.21.5/video-js.min.css" rel="stylesheet">
    <link href="https://unpkg.com/@videojs/themes@1/dist/fantasy/index.css" rel="stylesheet">
    <script src="https://vjs.fusioncdn.com/7.21.5/video.min.js"></script>
    <!-- Configuration might be different along with Stream. -->
    <script src="https://jsdelivr.fusioncdn.com/npm/@mlytics/p2sp-sdk@latest/bundle/driver.min.js"></script>
    <script
        src="https://jsdelivr.fusioncdn.com/npm/@mlytics/p2sp-sdk@latest/bundle/peripheral/player/videojs-hls.min.js"></script>
    <script src="./testtool.js"></script>
</head>

<body>
    <div style="width: 800px; height: 640px">
        <video id="video" class="video-js vjs-theme-fantasy"
            style="width: 800px; height: 640px; background-color: black;"></video>
    </div>
    <script>
        const params = new URL(window.location).searchParams;
        const src = params.get('src');
        const configURL = params.get('configURL');

        const loadConfig = async () => {
            await new Promise((resolve, reject) => {
                try {
                    const element = document.createElement('script');
                    element.setAttribute('src', configURL);
                    element.addEventListener('load', () => {
                        resolve();
                    });
                    element.addEventListener('error', () => {
                        reject(new Error('Fail to load MLYSDK config.'));
                    });
                    document.getElementsByTagName('head')[0].appendChild(element);
                } catch (error) {
                    reject(error);
                }
            });
        };

        const loadPlayer = async () => {
            const driver = mlysdk.driver.initialize({
                server: {
                    host: {
                        fqdn: "vsp.mlytics.co"
                    }
                }
            })
            const adapter = driver.extensions.VideojsHlsPlayerPlugin.create(video, {
                autoplay: true,
                controls: true,
                sources: [{
                    src,
                    type: 'application/vnd.apple.mpegurl'
                }],
                html5: {
                    hlsConfig: {
                        liveSyncDuration: 4,
                        liveMaxLatencyDuration: 8,
                        maxLiveSyncPlaybackRate: 1.1,
                    }
                }
            });
            window.driver = driver;
            window.adapter = adapter;

            const player = adapter.player;

            player.one('ready', () => {
                const element = player.contentEl().querySelector('video');
                testTool.bindMedia(element);
                const hls = adapter.protocol;
                testTool.bindHLSEvents(hls);
            });
        }

        Promise.resolve().then(async () => {
            await loadConfig();
        }).then(async () => {
            await loadPlayer();
        });

    </script>
</body>
</html>
